[project]
name = "engine"
version = "0.0.1"
description = "Analysis engine for Magonia"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "certifi>=2026.10.18",
    "pywavelets>=1.6",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pypdf>=6.21.4",
    "torch>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["live: needs a real Earth Engine connection"]
addopts = "-m 'not live'"

# PyTorch from its CPU-only index: the series are short, a GPU is not needed, and the CPU
# wheels are a fraction of the size
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
