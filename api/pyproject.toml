[project]
name = "api"
version = "0.0.1"
description = "HTTP API for Magonia"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "engine",
]

[project.optional-dependencies]
# the verifier that checks Magon's sentences against papers runs inside the API
verify = ["engine[verify]"]

[tool.uv.sources]
engine = { path = "../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.uv.sources.torch]
index = "pytorch-cpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
